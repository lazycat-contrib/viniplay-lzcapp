name: ViniPlay
package: community.lazycat.app.viniplay
version: 0.7.0
min_os_version: 1.3.8
description: 一个功能强大、可自托管的 IPTV 播放器，具有现代化的网络界面
homepage: https://github.com/ardoviniandrea/ViniPlay
author: ardoviniandrea
application:
  subdomain: viniplay
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://viniplay:8998/

services:
  viniplay:
    container_name: viniplay
    #  ardovini/viniplay:latest
    image: registry.lazycat.cloud/czyt/ardovini/viniplay:79a06e970ce2084f
    environment:
      - SESSION_SECRET={{stable_secret "session_secret" }}
      # Add a contact email for VAPID push notifications.
      # This is required by push services. It should start with "mailto:".
      - VAPID_CONTACT_EMAIL=mailto:your_email@example.com
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/dvr:/dvr

locales:
  zh:
    name: "ViniPlay"
    description: "一个功能强大、可自托管的 IPTV 播放器，具有现代化的网络界面"
  en:
    name: "ViniPlay"
    description: "A powerful, self-hosted IPTV player with a modern web interface."
